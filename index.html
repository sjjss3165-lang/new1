<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>老闆管理後台 - 極星咖啡</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #343a40; color: white; }
        .order-card { background: white; color: black; border-radius: 10px; border-left: 8px solid #c5a059; transition: 0.3s; }
        .stats-box { background: #f8f9fa; color: black; border-radius: 10px; position: sticky; top: 20px; }
        .timestamp { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>極星咖啡 - 老闆管理端</h2>
        <button class="btn btn-outline-danger" onclick="clearOrders()">清空今日訂單 (結帳)</button>
    </div>

    <div class="row">
        <div class="col-md-7">
            <h4>最新訂單 (即時更新)</h4>
            <div id="order-wall"></div>
        </div>

        <div class="col-md-5">
            <div class="stats-box p-4 shadow">
                <h4>今日銷售總結</h4>
                <hr>
                <div id="stats-content">
                    <p class="text-muted text-center py-3">尚無點餐紀錄</p>
                </div>
                <div class="mt-4 border-top pt-3 text-end">
                    <h5>今日總營收: <span class="text-danger">$ <span id="total-revenue">0</span></span></h5>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 初始化 Firebase (https://console.firebase.google.com/u/0/project/kfj-or/database/kfj-or-default-rtdb/data/~2F請填入與 index.html 相同的網址)
    const firebaseConfig = { databaseURL: "https://console.firebase.google.com/u/0/project/kfj-or/database/kfj-or-default-rtdb/data/~2F" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 監聽新訂單
    db.ref('orders').on('value', (snapshot) => {
        const orders = snapshot.val();
        renderAdmin(orders);
    });

    function renderAdmin(orders) {
        const wall = document.getElementById('order-wall');
        const stats = document.getElementById('stats-content');
        const rev = document.getElementById('total-revenue');
        
        if (!orders) {
            wall.innerHTML = '<p class="text-muted py-5 text-center">目前沒有新訂單</p>';
            stats.innerHTML = '<p class="text-muted text-center py-3">尚無銷售統計</p>';
            rev.innerText = '0';
            return;
        }

        let totalRev = 0;
        let summary = {};
        let wallHTML = '';

        // 由新到舊排序
        const sortedIDs = Object.keys(orders).reverse();

        sortedIDs.forEach(id => {
            const o = orders[id];
            totalRev += parseInt(o.total);
            
            // 累計各品項銷量
            o.items.forEach(name => {
                summary[name] = (summary[name] || 0) + 1;
            });

            wallHTML += `
                <div class="card order-card p-3 mb-3 shadow-sm">
                    <div class="d-flex justify-content-between">
                        <span class="timestamp">${new Date(o.timestamp).toLocaleTimeString()}</span>
                        <button class="btn-close" onclick="deleteOrder('${id}')"></button>
                    </div>
                    <div class="h5 mt-2 mb-1">${o.items.join(' 、 ')}</div>
                    <div class="text-end fw-bold text-danger">金額: $${o.total}</div>
                </div>`;
        });

        wall.innerHTML = wallHTML;
        rev.innerText = totalRev;

        // 顯示統計摘要
        stats.innerHTML = Object.entries(summary).map(([name, count]) => `
            <div class="d-flex justify-content-between mb-2">
                <span>${name}</span>
                <span class="badge bg-primary rounded-pill pt-2">${count} 份</span>
            </div>
        `).join('');
    }

    function deleteOrder(id) {
        if(confirm("確定刪除這筆訂單嗎？")) db.ref('orders/' + id).remove();
    }

    function clearOrders() {
        if(confirm("這將會清除所有現有訂單，確定結帳嗎？")) db.ref('orders').remove();
    }
</script>
</body>
</html>
