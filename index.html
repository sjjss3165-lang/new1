<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>老闆管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-secondary text-white">
    <div class="container py-4">
        <h2 class="mb-4">極星咖啡 - 管理後台</h2>
        
        <div class="row">
            <div class="col-md-7">
                <h4>即時訂單牆</h4>
                <div id="order-wall" class="row"></div>
            </div>

            <div class="col-md-5">
                <div class="card text-dark p-3">
                    <h4>今日銷售統計</h4>
                    <ul id="stats-list" class="list-group"></ul>
                    <hr>
                    <h5>今日總營收: $<span id="daily-revenue">0</span></h5>
                    <button class="btn btn-danger mt-3" onclick="resetDay()">結帳並清空數據</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const config = { databaseURL: "你的_FIREBASE_URL" };
    firebase.initializeApp(config);
    const db = firebase.database();

    db.ref('orders').on('value', snapshot => {
        const data = snapshot.val();
        renderAdmin(data);
    });

    function renderAdmin(orders) {
        const wall = document.getElementById('order-wall');
        const statsList = document.getElementById('stats-list');
        const revSpan = document.getElementById('daily-revenue');
        
        wall.innerHTML = '';
        let totalRev = 0;
        let itemCounts = {}; // 用來統計項目

        if (!orders) {
            statsList.innerHTML = "尚無數據";
            revSpan.innerText = "0";
            return;
        }

        for (let id in orders) {
            const o = orders[id];
            totalRev += parseInt(o.total);
            
            // 統計每個品項出現幾次
            o.items.forEach(name => {
                itemCounts[name] = (itemCounts[name] || 0) + 1;
            });

            // 顯示訂單卡片
            wall.innerHTML = `
                <div class="col-12 mb-2">
                    <div class="card p-2 text-dark">
                        <b>時間: ${new Date(o.timestamp).toLocaleTimeString()}</b>
                        <div>品項: ${o.items.join(', ')}</div>
                        <div class="text-danger text-end">金額: $${o.total}</div>
                    </div>
                </div>` + wall.innerHTML;
        }

        // 渲染統計列表
        statsList.innerHTML = Object.entries(itemCounts).map(([name, count]) => `
            <li class="list-group-item d-flex justify-content-between">
                <span>${name}</span>
                <span class="badge bg-primary rounded-pill">${count} 份</span>
            </li>
        `).join('');
        revSpan.innerText = totalRev;
    }

    function resetDay() {
        if(confirm("確定要清空今天的所有資料嗎？")) db.ref('orders').remove();
    }
</script>
</body>
</html>
